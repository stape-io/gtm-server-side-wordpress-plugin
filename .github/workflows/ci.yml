name: CI

on:
  pull_request:
  push:
    branches: [master]
  # PRs run e2e against the WordPress/WooCommerce versions pinned in
  # .wp-env.e2e.json; this run tracks the latest releases instead, so an
  # upstream change shows up here rather than on an unrelated PR.
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

# The jobs only read the repository.
permissions:
  contents: read

# A newer push to the same pull request makes the in-flight run obsolete.
# Pushes to master keep running, since each commit there is checked on its own.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.head_ref || github.sha }}
  cancel-in-progress: true

jobs:
  scripts:
    name: Inline browser scripts
    # Nothing upstream changes on a schedule for these.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      # Type-checks tests/e2e, which the line above does not cover: the root
      # tsconfig only includes assets/src. Needs no browser or WordPress, so it
      # runs here rather than holding up the e2e job.
      - run: npm run typecheck:e2e

      # The tests/e2e rules a machine can check (eslint.config.mjs).
      - run: npm run lint:e2e

      - run: npm test

      # Versions agree and the plugin package holds only runtime files
      # (bin/check-release.mjs). deploy.yml runs it again against the tag.
      - run: npm run check:release

      # The package ships straight from the repository, so the bundle is
      # committed. Fail if it no longer matches its source.
      - name: Built bundle matches assets/src
        run: |
          npm run build
          git diff --exit-code -- assets/js/service-worker-patch.js

  e2e:
    name: End-to-end (WordPress + WooCommerce${{ github.event_name == 'schedule' && ', latest' || '' }})
    runs-on: ubuntu-latest
    # The suite currently takes seconds; the cap is here to stop a hung
    # wp-env or browser from burning a full runner hour.
    timeout-minutes: 15
    # Results go to Testomat when this secret exists (it doesn't on PRs from
    # forks; playwright.config.ts then leaves the reporter out). Job-wide, so
    # the Testomat steps below can skip on it.
    env:
      TESTOMATIO: ${{ secrets.TESTOMATIO }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # Only chromium: both of playwright.config.ts's test projects (parallel,
      # serial) run in it.
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      # wp-env merges this file over .wp-env.e2e.json. `plugins` and `themes`
      # are replaced rather than merged, hence the full lists.
      - name: Track the latest WordPress, WooCommerce and theme
        if: github.event_name == 'schedule'
        run: |
          cat > .wp-env.e2e.override.json <<'JSON'
          {
            "core": null,
            "plugins": [ "https://downloads.wordpress.org/plugin/woocommerce.zip", "." ],
            "themes": [ "https://downloads.wordpress.org/theme/twentytwentyfive.zip" ]
          }
          JSON

      # Boots WordPress + WooCommerce in Docker and runs bin/wp-env-setup.sh
      # through the afterStart lifecycle hook, which configures the store.
      - name: Start WordPress
        run: npm run env:e2e:start

      # Names the Testomat run. A pull request shows the commit it was pushed
      # at (github.sha there is the merge commit), so pushes to one PR differ.
      - name: Name the Testomat run
        env:
          EVENT: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.number }}
          HEAD_REF: ${{ github.head_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          short="${HEAD_SHA:0:7}"
          case "$EVENT" in
            pull_request) title="PR #${PR_NUMBER}: ${HEAD_REF} @ ${short}" ;;
            schedule)     title="Nightly (latest WP/WC) @ ${short}" ;;
            *)            title="${REF_NAME} @ ${short}" ;;
          esac
          echo "TESTOMATIO_TITLE=${title}" >> "$GITHUB_ENV"
          # The nightly run tests the latest WordPress and WooCommerce, not the
          # pinned versions, so it gets its own group in Testomat.
          if [ "$EVENT" = "schedule" ]; then
            echo "TESTOMATIO_RUNGROUP_TITLE=Nightly (latest WP and WC)" >> "$GITHUB_ENV"
          fi

      # Cases are matched by the @T{id} tag in each test title. The parallel
      # and serial steps report into one Testomat run, started here and
      # finished last.
      - name: Start the Testomat run
        if: env.TESTOMATIO != ''
        run: echo "TESTOMATIO_RUN=$(npx @testomatio/reporter start --format id)" >> "$GITHUB_ENV"

      - name: Run e2e tests
        id: parallel
        run: npm run test:e2e:parallel
        env:
          TESTOMATIO_PROCEED: 1

      # The specs that save settings every page reads, one at a time after the
      # parallel ones (see playwright.config.ts). They run when those failed too,
      # not when the store never started.
      - name: Run serial e2e tests
        if: (success() || failure()) && steps.parallel.outcome != 'skipped'
        run: npm run test:e2e:serial
        env:
          TESTOMATIO_PROCEED: 1

      - name: Finish the Testomat run
        if: always() && env.TESTOMATIO_RUN != ''
        run: npx @testomatio/reporter finish

      # The HTML report plus the traces kept by retain-on-failure: what makes a
      # red run debuggable without reproducing it locally.
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            tests/e2e/playwright-report
            tests/e2e/playwright-report-serial
            tests/e2e/test-results
            tests/e2e/test-results-serial
          retention-days: 7
          if-no-files-found: ignore

      # WP_DEBUG_LOG is on (see .wp-env.e2e.json), so PHP notices and fatals
      # land here. They never reach the Playwright report, and a failing test
      # is often explained by them.
      - name: Print WordPress debug log
        if: failure()
        run: npx wp-env --config=.wp-env.e2e.json run wordpress cat /var/www/html/wp-content/debug.log || true
