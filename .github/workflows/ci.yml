name: CI

on:
  pull_request:
  push:
    branches: [master]

# The job only reads the repository.
permissions:
  contents: read

jobs:
  scripts:
    name: Inline browser scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - run: npm test

      # The package ships straight from the repository, so the bundle is
      # committed. Fail if it no longer matches its source.
      - name: Built bundle matches assets/src
        run: |
          npm run build
          git diff --exit-code -- assets/js/service-worker-patch.js
